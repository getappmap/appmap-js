name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  # Documentation-only pull requests (e.g. the docs sync opened by
  # .github/workflows/sync-docs.yml) still need test_cli, which builds the
  # `appmap navie help` index over docs/ — but nothing else. Uses the pull request
  # files API rather than a diff so it needs no checkout.
  changes:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}

    steps:
      - name: Detect documentation-only changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != 'pull_request' ]; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if [ -n "$files" ] && ! grep -qv '^docs/' <<<"$files"; then
            docs_only=true
          else
            docs_only=false
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "$(wc -l <<<"$files") changed file(s), docs_only=$docs_only" >> "$GITHUB_STEP_SUMMARY"

  test_components:
    runs-on: ubuntu-latest

    needs: [changes]

    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The storybook runner is going to do some Git operations that rely on access to the main branch.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Build
        run: |
          yarn workspaces foreach -v -t --exclude root --exclude @appland/appmap --exclude @appland/scanner run build

      - name: Test
        run: |
          cd packages/components
          yarn run lint
          yarn run test

  test_chromatic:
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true'

    needs: [changes]

    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Build
        run: |
          yarn workspaces foreach -v -t --exclude root --exclude @appland/appmap --exclude @appland/scanner run build

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          workingDir: packages/components

  test_cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Build
        run: yarn run build

      - name: Test
        run: |
          cd packages/cli
          yarn run lint
          yarn run test

  test_scanner:
    runs-on: ubuntu-latest

    needs: [changes]

    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Build
        run: |
          yarn workspaces foreach -v -t --exclude root --exclude @appland/appmap --exclude @appland/components run build

      - name: Test
        run: |
          cd packages/scanner
          yarn run lint
          yarn run test

  test_native:
    runs-on: ubuntu-latest

    needs: [changes]

    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Build
        run: yarn run build

      - name: Test
        run: |
          cd packages/cli
          yarn test:binary

  test_the_rest:
    runs-on: ubuntu-latest

    needs: [changes]

    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Build
        run: |
          yarn workspaces foreach -v -t --exclude root --exclude @appland/appmap --exclude @appland/components --exclude @appland/scanner run build

      - name: Test
        run: |
          yarn workspaces foreach -v -t --exclude root --exclude @appland/appmap --exclude @appland/components --exclude @appland/scanner run lint
          yarn workspaces foreach -v -t --exclude root --exclude @appland/appmap --exclude @appland/components --exclude @appland/scanner run test

      - name: Test repository scripts
        run: yarn test:scripts

  release:
    if: github.ref == 'refs/heads/main'
    needs:
      - test_cli
      - test_components
      - test_scanner
      - test_native
      - test_the_rest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.YARN_NPM_AUTH_TOKEN }}
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          GIT_AUTHOR_NAME: appland-release
          GIT_AUTHOR_EMAIL: release@app.land
          GIT_COMMITTER_NAME: appland-release
          GIT_COMMITTER_EMAIL: release@app.land
        run: |
          yarn
          yarn build
          yarn semantic-release
          yarn chromatic --auto-accept-changes
